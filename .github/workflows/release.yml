name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      skip_smoke:
        description: "跳过安装包冒烟检查"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  version:
    name: 版本校验
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ -z "$version" ]; then echo "无法读取工作区版本号" >&2; exit 1; fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "版本号 $version 不是 x.y.z 形式，无法生成 Windows 版本资源" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "标签 ${GITHUB_REF_NAME} 与工作区版本 v$version 不一致" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows 构建
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.1
      - uses: Swatinem/rust-cache@v2
      - name: 发布构建
        run: cargo build --release -p bt-gui -p bt-cli
      - name: 纯 CLI 构建
        run: cargo build --release -p bt-cli --no-default-features
      - name: 组装绿色包
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          $guiStage = "dist/gui"
          New-Item -ItemType Directory -Force $guiStage | Out-Null
          Copy-Item target/release/bt-gui.exe $guiStage
          Copy-Item LICENSE $guiStage
          if (Test-Path README.md) { Copy-Item README.md $guiStage }
          Compress-Archive -Path "$guiStage/*" -DestinationPath "dist/BluetoothTransfer-$version-windows-x64.zip" -Force
          $cliStage = "dist/cli"
          New-Item -ItemType Directory -Force $cliStage | Out-Null
          Copy-Item target/release/bt.exe $cliStage
          Copy-Item target/release/btrecv.exe $cliStage
          Copy-Item LICENSE $cliStage
          Compress-Archive -Path "$cliStage/*" -DestinationPath "dist/BluetoothTransfer-$version-cli-windows-x64.zip" -Force
      - name: 安装 NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: 生成安装器
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $build = (Resolve-Path target/release).Path
          $output = Join-Path (Resolve-Path dist).Path "BluetoothTransfer-$version-setup.exe"
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $makensis)) { $makensis = "$env:ProgramFiles\NSIS\makensis.exe" }
          if (!(Test-Path $makensis)) { throw "未找到 makensis.exe" }
          & $makensis "/DVERSION=$version" "/DBUILD_DIR=$build" "/DOUTPUT_FILE=$output" packaging/windows/installer.nsi
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $output)) { throw "NSIS 生成失败" }
      - name: 体积断言
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $checks = @(
            @{ Path = "target/release/bt-gui.exe"; Limit = 20MB; Label = "GUI 单文件" },
            @{ Path = "dist/BluetoothTransfer-$version-setup.exe"; Limit = 15MB; Label = "NSIS 安装器" },
            @{ Path = "target/release/bt.exe"; Limit = 8MB; Label = "CLI 二进制" }
          )
          foreach ($check in $checks) {
            $size = (Get-Item $check.Path).Length
            Write-Host ("{0}: {1:N0} 字节" -f $check.Label, $size)
            if ($size -gt $check.Limit) { throw ("{0} 超过体积上限 {1}" -f $check.Label, $check.Limit) }
          }
      - name: 校验和
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          Get-ChildItem dist -File | Where-Object { $_.Name -ne "sha256sums.txt" } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content dist/sha256sums.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux 构建
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libgl1-mesa-dev libegl1-mesa-dev libwayland-dev pkg-config dpkg-dev file
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.1
      - uses: Swatinem/rust-cache@v2
      - name: 发布构建
        run: cargo build --release -p bt-gui -p bt-cli
      - name: 纯 CLI 构建
        run: cargo build --release -p bt-cli --no-default-features
      - name: 生成 deb
        run: VERSION=${{ needs.version.outputs.version }} packaging/linux/build-deb.sh
      - name: 下载 appimagetool
        run: |
          curl -fsSL -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
      - name: 生成 AppImage
        run: |
          VERSION=${{ needs.version.outputs.version }} APPIMAGETOOL=$PWD/appimagetool.AppImage packaging/linux/build-appimage.sh
      - name: 体积断言
        run: |
          version=${{ needs.version.outputs.version }}
          check() {
            size=$(stat -c %s "$1")
            limit=$2
            echo "$3: $size 字节"
            if [ "$size" -gt "$limit" ]; then echo "$3 超过体积上限 $limit" >&2; exit 1; fi
          }
          check target/release/bt-gui 20971520 "GUI 单文件"
          check target/release/bt 8388608 "CLI 二进制"
          check "dist/bluetooth-transfer_${version}_amd64.deb" 20971520 "deb"
      - name: 校验和
        run: |
          cd dist
          sha256sum * > sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/*
          if-no-files-found: error

  publish:
    name: 发布
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/checkout@v4
      - name: 合并校验和
        run: |
          find artifacts -type f ! -name sha256sums.txt -printf '%f\n' | sort
          find artifacts -type f ! -name sha256sums.txt -exec sha256sum {} \; > combined-sha256sums.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: 蓝牙传输 v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/windows-release/*
            artifacts/linux-release/*
            combined-sha256sums.txt