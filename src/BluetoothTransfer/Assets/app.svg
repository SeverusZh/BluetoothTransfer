<?xml version="1.0" encoding="UTF-8"?>
<!--
  BluetoothTransfer 应用图标（矢量源）
  设计：圆角蓝底 + 白色蓝牙符号 + 右上角"上传箭头"（表示文件推送）。
  视口 24x24；与 AppIcons.xaml 中的 XAML 几何保持同源，修改时需同步两处。
  打包产物：tools/IconGenerator 由 AppIcons.xaml 渲染生成 app.png / app.ico。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <rect x="0.5" y="0.5" width="23" height="23" rx="5.5" fill="#0B6BCB" stroke="#0958A8" stroke-width="0.6"/>
  <g stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M12 3.2 L12 20.8"/>
    <path d="M6.6 7.1 L17.4 16.9"/>
    <path d="M17.4 7.1 L6.6 16.9"/>
  </g>
  <path d="M18.4 3.8 L18.4 9.4 M16.5 5.7 L18.4 9.4 L20.3 5.7"
        stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
